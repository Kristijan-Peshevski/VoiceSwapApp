<!DOCTYPE html>
<html>
<head>
    <title>Train My Voice</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #222; color: #fff; }
        .nav { margin-bottom: 40px; }
        .nav a { color: #fff; text-decoration: none; margin: 0 15px; font-size: 18px; border-bottom: 2px solid transparent; }
        .nav a:hover { border-bottom: 2px solid #00d2ff; color: #00d2ff; }
        .box { background: #333; padding: 30px; border-radius: 10px; display: inline-block; max-width: 600px; }
        input[type="text"], input[type="file"] { width: 90%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #28a745; border: none; font-size: 16px; cursor: pointer; color: white; font-weight: bold; }
        button:hover { background: #218838; }
        .info { text-align: left; background: #444; padding: 15px; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">🎵 Voice Swap</a>
        <a href="/train/">🎙️ Train Voice</a>
    </div>

    <div class="box">
        <h1>🎙️ Train AI on MY Voice 🎙️</h1>
        {% if message %}
            <p style="color: #00ff00; font-weight: bold;">{{ message }}</p>
        {% endif %}

        <form action="/train_setup/" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Name your Model (e.g., Christian):</label><br>
            <input type="text" name="model_name" required placeholder="MyVoice"><br>

            <label>Select 10-20 Audio Clips (WAV/MP3):</label><br>
            <input type="file" name="dataset_files" multiple required accept=".wav,.mp3">
            <br>
            <button type="submit">Upload & Prepare Dataset</button>
        </form>
    </div>
</body>
</html>
