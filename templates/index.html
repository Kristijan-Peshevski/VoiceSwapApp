<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Swapper</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #222; color: #fff; }
        .nav { margin-bottom: 40px; }
        .nav a { color: #fff; text-decoration: none; margin: 0 15px; font-size: 18px; border-bottom: 2px solid transparent; }
        .nav a:hover { border-bottom: 2px solid #00d2ff; color: #00d2ff; }
        .box { background: #333; padding: 30px; border-radius: 10px; display: inline-block; max-width: 500px; width: 100%; }
        select, input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #00d2ff; border: none; font-size: 16px; cursor: pointer; color: #000; font-weight: bold; width: 100%; margin-top: 10px; }
        button:disabled { background: #555; cursor: wait; }
        .loader { display: none; margin-top: 15px; color: #00d2ff; }
    </style>
    <script>
        function startLoading() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('btn').disabled = true;
            document.getElementById('btn').innerText = "Processing...";
        }
    </script>
</head>
<body>
    <div class="nav">
        <a href="/">🎵 Voice Swap</a>
        <a href="/train/">🎙️ Train Voice</a>
    </div>

    <div class="box">
        <h1>🎵 AI Voice Swap 🎵</h1>

        {% if error %}
            <p style="color: #ff4444; background: #200; padding: 10px;">{{ error }}</p>
        {% endif %}

        <form action="/process/" method="post" enctype="multipart/form-data" onsubmit="startLoading()">
            {% csrf_token %}

            <label style="text-align: left; display: block;">1. Select Voice Model:</label>
            <select name="model_name" required>
                {% for model in models %}
                    <option value="{{ model }}">{{ model }}</option>
                {% empty %}
                    <option value="" disabled>No models found. Check assets/weights/</option>
                {% endfor %}
            </select>

            <label style="text-align: left; display: block; margin-top: 15px;">2. Select Processor:</label>
            <select name="device_type" style="background: #444; color: white;" required>
                <option value="cpu" selected>CPU (Laptop / Slow / Safe)</option>
                <option value="gpu">GPU (NVIDIA Only / Fast)</option>
            </select>

            <label style="text-align: left; display: block; margin-top: 15px;">3. Upload Song (MP3/WAV):</label>
            <input type="file" name="song" required accept=".mp3,.wav,.flac">

            <button type="submit" id="btn">Swap Voice</button>
        </form>

        <div id="loader" class="loader">
            <p>Separating Vocals... <br>AI Converting... <br>Mixing...</p>
        </div>
    </div>
</body>
</html>
